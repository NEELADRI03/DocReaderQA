services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docqa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./docqa-backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./docqa-backend/app:/code/app
      - ./storage:/data/storage
    # Lets the containers reach Ollama running on the Windows host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./docqa-backend
    command: arq app.workers.tasks.WorkerSettings
    env_file: .env
    volumes:
      - ./docqa-backend/app:/code/app
      - ./storage:/data/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./docqa-frontend
    # Vite exposes the VITE_* variables from here to the browser code
    env_file: .env
    ports:
      - "5173:5173"
    volumes:
      - ./docqa-frontend:/app
      # Anonymous volume so the Windows node_modules doesn't hide the container's packages
      - /app/node_modules

volumes:
  pgdata:
